[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-team-tasks"
version = "0.1.0"
description = "Notebook Telegram bot: team tasks in development"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "python-dotenv>=1.1,<2",
    "pydantic>=2.11,<3",
    "tzdata>=2025.2",
    "aiohttp-socks>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
notebook-bot = "notebook_bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

